# IMX577 2592x1944 capture template. Calibrate every physical camera and lens.
# Keep resolution and rotation identical during calibration and deployment.
camera:
  usb_cam_driver:
    video_device: "/dev/video0"
    image_width: 2592
    image_height: 1944
    framerate: 30
    pixel_format: "mjpeg"
    io_method: "mmap"
    camera_name: "camera"
    camera_frame_id: "camera_optical_frame"
    output_topic: "image_raw"
    compressed_output_topic: "image_raw/mjpeg"
    worker_threads: 3
    capture_buffers: 6
    capture_queue_size: 6
    decoded_queue_size: 3
    fast_upsample: true
    rotation_angle: 180
    statistics_period: 5.0
