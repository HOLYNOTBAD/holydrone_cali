# 当前 OV2710（用户提供型号）USB 相机的 1920x1080 MJPEG 采集配置。
# 采集配置不包含内参；旋转、分辨率改变后应重新标定。
camera:
  usb_cam_driver:
    video_device: "/dev/video0"
    image_width: 1920
    image_height: 1080
    framerate: 30
    pixel_format: "mjpeg"
    io_method: "mmap"
    camera_name: "camera"
    camera_frame_id: "camera_optical_frame"
    output_topic: "image_raw"
    compressed_output_topic: "image_raw/mjpeg"
    worker_threads: 3
    capture_buffers: 6
    capture_queue_size: 6
    decoded_queue_size: 3
    fast_upsample: true
    rotation_angle: 180
    statistics_period: 5.0
